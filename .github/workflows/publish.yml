# Publish the orderly-chaos package to PyPI.
#
# Runs when a GitHub Release is published (or manually). Uses PyPI trusted
# publishing (OpenID Connect), so no API token is stored in the repository.
# One-time setup, by the package owner on https://pypi.org/manage/account/publishing:
# add a pending publisher for this repository with workflow name
# `publish.yml`. Afterwards every published release uploads the sdist and
# the wheel built here automatically.
#
# The release version comes from python/orderly_chaos/_version.py via
# pyproject.toml; tools/check_versions.py (CI docs job) guarantees the
# release tag, the code, and the metadata agree.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Smoke-test the sdist in a fresh environment
        run: |
          python -m venv /tmp/sdist-check
          /tmp/sdist-check/bin/pip install dist/*.tar.gz
          /tmp/sdist-check/bin/python -c "from orderly_chaos import LimitOrderBook, Side; b = LimitOrderBook(); b.limit_sell(1, 100, 10050); assert b.limit_buy(2, 40, 10050) == 40; print('sdist OK')"

      - name: Publish to PyPI
        # Uses trusted publishing (OpenID Connect) when no token is
        # configured. If you added a PYPI_API_TOKEN secret instead, it is
        # used as a fallback automatically.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
