# Build and publish the Orderly Chaos Docker image.
#
# Every push and pull request builds the `test` stage (which runs the full
# Python suite inside the image) and the runtime image. Images are pushed
# to GHCR only for version tags (v*), using the built-in GITHUB_TOKEN, so
# no secrets need to be configured.
#
#   ghcr.io/<owner>/orderly-chaos:<tag>   (e.g. v0.2.0)
#   ghcr.io/<owner>/orderly-chaos:latest  (main branch)

name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    name: Test, build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Run test suite inside the image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          push: false

      - name: Build (and push on tags) the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
