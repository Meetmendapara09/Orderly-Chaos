# Continuous integration for Orderly Chaos.
#
# Three jobs on ubuntu-latest:
#   1. cpp     - every Bazel target (C++ tests, examples, benchmark smoke test)
#   2. python  - build the shared library with Bazel and run the Python suite
#   3. docs    - internal link check and version consistency check
#
# Notes:
#   * Bazelisk (downloaded as a binary, not via npm) installs Bazel;
#     USE_BAZEL_VERSION pins the LTS 7 series
#     (the project targets Bazel 7+ with Bzlmod).
#   * Compiler flags come from the committed .bazelrc (build:linux).
#   * //python:shared_lib stages the platform-specific library
#     (lib_orderly_chaos.so on Linux) that python/orderly_chaos loads.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  USE_BAZEL_VERSION: 7.4.1

jobs:
  cpp:
    name: C++ tests, examples & benchmark (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL -o "$HOME/bin/bazel" "https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64"
          chmod +x "$HOME/bin/bazel"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          bazel version

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '**/*.bzl', '**/BUILD.bazel') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: Run all Bazel tests
        run: bazel test //... --test_output=errors

  python:
    name: Python bindings (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bazelisk
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL -o "$HOME/bin/bazel" "https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64"
          chmod +x "$HOME/bin/bazel"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          bazel version

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', '**/*.bzl', '**/BUILD.bazel') }}
          restore-keys: bazel-${{ runner.os }}-

      - name: Build shared library with Bazel
        run: |
          bazel build //python:shared_lib
          cp bazel-bin/python/orderly_chaos/lib_orderly_chaos.* python/orderly_chaos/

      - name: Install test dependencies
        run: pip install pytest

      - name: Run Python test suite (Bazel-built library)
        run: PYTHONPATH=python python -m pytest tests/python -v

      - name: Install package from source and re-test
        run: |
          rm -f python/orderly_chaos/lib_orderly_chaos.*
          pip install .
          python -m pytest tests/python -v

  docs:
    name: Docs link & version check (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check internal docs links resolve
        run: python tools/check_docs.py

      - name: Check version consistency
        run: python tools/check_versions.py
